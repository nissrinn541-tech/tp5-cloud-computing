name: ci

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t flask-app:${{ github.sha }} ./flask-app

      - name: Smoke test
        run: |
          docker run -d --name t -p 5000:5000 flask-app:${{ github.sha }}
          sleep 5
          curl -f http://localhost:5000/health
